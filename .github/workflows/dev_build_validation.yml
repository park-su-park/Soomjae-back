name: Dev Branch Merge Build Validation

env:
  DB_URL: ${{ secrets.DB_URL }}
  DB_USERNAME: ${{ secrets.DB_USERNAME }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

on:
  pull_request:
    branches:
      - dev  # dev 브랜치로 향하는 PR 이벤트에서 트리거

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 리포지토리 체크아웃
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      # 2. Java 환경 설정
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Gradle 캐시 설정
      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4. application.properties 생성
      - name: Generate application.properties
        run: |
          mkdir -p src/main/resources
          cat <<EOF > src/main/resources/application.properties
          server.port=8080
          spring.datasource.url=${{ secrets.DB_URL }}
          spring.datasource.username=${{ secrets.DB_USERNAME }}
          spring.datasource.password=${{ secrets.DB_PASSWORD }}
          spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
          spring.jpa.hibernate.ddl-auto=none
          spring.jpa.show-sql=true

          spring.security.oauth2.client.registration.google.client-id=
          spring.security.oauth2.client.registration.google.client-secret=
          spring.security.oauth2.client.registration.google.redirect-uri=
          spring.security.oauth2.client.registration.google.scope=

          spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
          spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
          spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
          spring.security.oauth2.client.provider.google.user-name-attribute=sub

          spring.security.oauth2.client.registration.kakao.client-id=
          spring.security.oauth2.client.registration.kakao.client-secret=
          spring.security.oauth2.client.registration.kakao.redirect-uri=
          spring.security.oauth2.client.registration.kakao.authorization-grant-type=
          spring.security.oauth2.client.registration.kakao.scope=
          spring.security.oauth2.client.registration.kakao.client-name=

          spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
          spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
          spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
          spring.security.oauth2.client.provider.kakao.user-name-attribute=id

          mybatis.mapper-locations=classpath:mappers/**/*.xml
          mybatis.configuration.map-underscore-to-camel-case=true

          spring.devtools.restart.enabled=true
          spring.devtools.livereload.enabled=true
          EOF

      # 5. Gradle 빌드 실행
      - name: Build with Gradle
        run: ./gradlew build -x test

      # CI 실패 시 디스코드 알림
      - name: Notify Failure on Discord
        if: ${{ failure() }}
        uses: Ilshidur/action-discord@0.3.2
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_SERVER_CI}}
          DISCORD_USERNAME: CI_CAT
          DISCORD_AVATAR: https://github.com/user-attachments/assets/f4a333ae-c6e0-43ed-abe7-4e50a519a3be
          DISCORD_EMBEDS: |
            [
              {
                "title": "빌드 실패했다냥 ❌",
                "color": 15158332,
                "description": "[#${{ github.event.pull_request.number }}] ${{ github.event.pull_request.title }}\n${{ github.event.pull_request.html_url }}",
                "fields": [
                  {
                    "name": "브랜치",
                    "value": "${{ github.ref }}",
                    "inline": true
                  },
                  {
                    "name": "작성자",
                    "value": "${{ github.event.pull_request.user.login }}",
                    "inline": true
                  }
                ]
              }
            ]
