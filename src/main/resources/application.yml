spring:
  profiles:
    active: local
    group:
      local: local, common
      blue: blue, common
      green: green, common

server:
  env: blue

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: TRACE
---
spring:
  config:
    activate:
      on-profile: local
  security:
    oauth2:
      client:
        registration:
          google:
            redirect-uri: http://localhost:8080/login/oauth2/code/google

server:
  port: 8080
  serverAddress: localhost

serverName: local_server
---

spring:
  config:
    activate:
      on-profile: blue
  security:
    oauth2:
      client:
        registration:
          google:
            redirect-uri: http://${EC2_IP}/login/oauth2/code/google

server:
  port: 8080
  serverAddress: 13.54.160.4

serverName: blue_server
---

spring:
  config:
    activate:
      on-profile: green
  security:
    oauth2:
      client:
        registration:
          google:
            redirect-uri: http://${EC2_IP}/login/oauth2/code/google

server:
  port: 8081
  serverAddress: 13.54.160.4

serverName: green_server
---

spring:
  config:
    activate:
      on-profile: common
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}?serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          connectionpoolsize: 10
          connectionpooltimeout: 300000

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          # Apple은 나중에 구현

  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true


# ===============================
# 쿠키 보안 설정
# ===============================
app:
  cookie:
    secure: false
  profile:
    default-image-url: ${DEFAULT_PROFILE_IMAGE_URL}

server:
  ssl:
    enabled: false
    key-store: classpath:keystore.p12
    key-store-type: PKCS12
    key-store-password: ${KEYSTORE_PASSWORD}
    key-alias: ${KEYSTORE_ALIAS}

jwt:
  secret: ${JWT_SECRET}
  refresh:
    secret: ${JWT_REFRESH_SECRET}

fcm:
  firebase_config_path: ${FIREBASE_CONFIG_PATH}
cloud:
  aws:
    s3:
      bucket: ${AWS_S3_BUCKET}
    region:
      static: ${AWS_S3_BUCKET_REGION}
    stack:
      auto: false
