<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>숨재 이메일 인증</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f6f9fc;
      padding: 20px;
      line-height: 1.6;
    }

    .email-container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 40px 30px;
      text-align: center;
    }

    .header h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .content {
      padding: 40px 30px;
    }

    .welcome-text {
      font-size: 18px;
      color: #2c3e50;
      margin-bottom: 30px;
      text-align: center;
    }

    .code-section {
      text-align: center;
      margin: 30px 0;
    }

    .code-label {
      font-size: 16px;
      color: #7f8c8d;
      margin-bottom: 15px;
    }

    .verification-code {
      display: inline-block;
      background: linear-gradient(135deg, #3498db, #2980b9);
      color: white;
      font-size: 32px;
      font-weight: bold;
      letter-spacing: 8px;
      padding: 20px 40px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3);
      font-family: 'Courier New', monospace;
      user-select: all;
      cursor: pointer;
    }

    .verification-code:hover {
      transform: translateY(-2px);
      transition: transform 0.2s ease;
    }

    .instructions {
      background-color: #ecf0f1;
      border-radius: 8px;
      padding: 25px;
      margin: 30px 0;
    }

    .instructions h3 {
      color: #2c3e50;
      margin-bottom: 15px;
      font-size: 18px;
    }

    .instructions ol {
      color: #34495e;
      padding-left: 20px;
    }

    .instructions li {
      margin-bottom: 8px;
    }

    .warning {
      background-color: #fff3cd;
      border-left: 4px solid #ffc107;
      border-radius: 8px;
      padding: 20px;
      margin: 25px 0;
    }

    .warning h4 {
      color: #856404;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
    }

    .warning ul {
      color: #856404;
      padding-left: 20px;
    }

    .warning li {
      margin-bottom: 5px;
    }

    .footer {
      background-color: #2c3e50;
      color: #bdc3c7;
      padding: 30px;
      text-align: center;
    }

    .footer h4 {
      color: white;
      margin-bottom: 15px;
    }

    .footer p {
      margin-bottom: 8px;
      font-size: 14px;
    }

    .divider {
      border: none;
      border-top: 1px solid #ecf0f1;
      margin: 25px 0;
    }

    .highlight {
      background-color: #e8f5e8;
      padding: 2px 4px;
      border-radius: 3px;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      body { padding: 10px; }
      .email-container { margin: 0; }
      .header, .content, .footer { padding: 25px 20px; }
      .verification-code {
        font-size: 24px;
        letter-spacing: 4px;
        padding: 15px 25px;
      }
    }
  </style>
</head>
<body>
<div class="email-container">
  <div class="header">
    <h1>숨재</h1>
  </div>

  <div class="content">
    <p class="welcome-text">
      안녕하세요!<br>
      숨재 커뮤니티 가입을 위한 이메일 인증을 진행해주세요.
    </p>

    <div class="code-section">
      <p class="code-label">아래 인증코드를 입력해주세요</p>
      <div class="verification-code" th:text="${verificationCode}">123456</div>
    </div>

    <div class="instructions">
      <h3>인증 방법</h3>
      <ol>
        <li>위의 <span class="highlight">6자리 인증코드</span>를 복사하세요</li>
        <li>회원가입 페이지로 돌아가세요</li>
        <li>인증코드 입력란에 붙여넣기 하세요</li>
        <li><strong>'인증하기'</strong> 버튼을 클릭하세요</li>
      </ol>
    </div>

    <hr class="divider">

    <div class="warning">
      <h4>⚠️ 보안 안내사항</h4>
      <ul>
        <li><strong>유효시간:</strong> 이 코드는 <span th:text="${expirationMinutes}">5</span>분간만 유효합니다</li>
        <li><strong>보안:</strong> 코드를 타인과 공유하지 마세요</li>
        <li><strong>의심스러운 요청:</strong> 본인이 요청하지 않았다면 이 이메일을 무시하세요</li>
      </ul>
    </div>
  </div>
</div>
</body>
</html>
